name: Build and deploy Marp slides

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '**/*.css'
      - '**/*.svg'
      - '**/diagrams/**'
      - '**/images/**'
      - '**/examples/**'
      - '**/notes/evidence/**'
      - 'Makefile'
      - '**/Makefile'
      - 'presentation.mk'
      - '.marprc.yml'
      - '.github/workflows/slides.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Build slides (HTML + PDF)
        run: make

      - name: Prepare distribution directory
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          presentations=()
          while IFS= read -r md; do
            dir="$(dirname "$md")"
            base="$(basename "$md" .md)"
            html="$dir/$base.html"
            pdf="$dir/$base.pdf"

            [ -f "$html" ] || continue

            mkdir -p "dist/$dir"
            cp "$html" "dist/$dir/index.html"
            if [ -f "$pdf" ]; then
              cp "$pdf" "dist/$dir/"
            fi

            for assets in diagrams images examples notes/evidence; do
              if [ -d "$dir/$assets" ]; then
                mkdir -p "dist/$dir/$assets"
                cp -R "$dir/$assets/." "dist/$dir/$assets/"
              fi
            done

            for asset in "$dir"/*.svg "$dir"/*.png "$dir"/*.jpg "$dir"/*.jpeg "$dir"/*.webp; do
              [ -f "$asset" ] || continue
              cp "$asset" "dist/$dir/"
            done

            presentations+=("$dir|$base")
          done < <(make --no-print-directory list)

          write_index() {
            local archive="$1"
            local title="Available presentations"
            local entry dir base relative_dir pdf_path year
            if [ -n "$archive" ]; then
              title="$archive presentations"
            fi

            {
              echo '<!doctype html>'
              echo '<html lang="en">'
              echo '<head>'
              echo '  <meta charset="UTF-8" />'
              echo '  <meta name="viewport" content="width=device-width, initial-scale=1.0" />'
              echo "  <title>${title}</title>"
              echo '  <style>body{font-family:Arial,sans-serif;margin:2rem;}h1{margin-bottom:0.5rem;}ul{line-height:1.8;}li{margin-bottom:0.25rem;}</style>'
              echo '</head>'
              echo '<body>'
              echo "  <h1>${title}</h1>"
              if [ -n "$archive" ]; then
                echo '  <p><a href="../">All presentations</a></p>'
              fi
              echo '  <ul>'

              if [ -z "$archive" ]; then
                for year in dist/[0-9][0-9][0-9][0-9]; do
                  [ -d "$year" ] || continue
                  year="${year##*/}"
                  echo "    <li><a href=\"./${year}/\">${year}/</a></li>"
                done
              fi

              for entry in "${presentations[@]}"; do
                dir="${entry%%|*}"
                base="${entry##*|}"
                if [ -n "$archive" ]; then
                  [[ "$dir" == "$archive/"* ]] || continue
                  relative_dir="${dir#"$archive/"}"
                else
                  [[ "$dir" != */* ]] || continue
                  relative_dir="$dir"
                fi
                pdf_path="./${relative_dir}/${base}.pdf"

                echo -n "    <li><strong>${relative_dir}</strong>: <a href=\"./${relative_dir}/\">HTML</a>"
                if [ -f "dist/${dir}/${base}.pdf" ]; then
                  echo " | <a href=\"${pdf_path}\">PDF</a></li>"
                else
                  echo '</li>'
                fi
              done

              echo '  </ul>'
              echo '</body>'
              echo '</html>'
            } > "dist/${archive:+$archive/}index.html"
          }

          write_index ""
          for year in dist/[0-9][0-9][0-9][0-9]; do
            [ -d "$year" ] || continue
            write_index "${year##*/}"
          done

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
